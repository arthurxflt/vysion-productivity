<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vysion Productivity</title>
<meta name="theme-color" content="#1d1d1f">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  var theme = 'dark';
  try { if (localStorage.getItem('vysion-theme-v2') === 'light') theme = 'light'; } catch (e) {}
  document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vysion">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="habits.css">
</head>
<body>

<section class="auth-gate" id="authGate">
  <div class="auth-card">
    <img src="logo-header.png" alt="Vysion Productivity" class="auth-logo">
    <p class="auth-hint">Connecte-toi pour accéder à ton espace.</p>
    <input type="email" id="authEmail" class="auth-input" placeholder="Email" autocomplete="email">
    <input type="password" id="authPassword" class="auth-input" placeholder="Mot de passe" autocomplete="current-password">
    <div class="auth-actions">
      <button type="button" class="btn-accent" id="authSignInBtn">Se connecter</button>
      <button type="button" class="btn-quiet" id="authSignUpBtn">Créer un compte</button>
    </div>
    <p class="auth-status" id="authStatus" role="status"></p>
  </div>
</section>

<div class="app" id="appContent" hidden>

  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="sb-brand"><img src="logo-header.png" alt="" height="22" class="sb-logo"><span>Vysion</span></div>
    <nav class="sb-nav" id="sbNav" aria-label="Vues"></nav>
    <div class="sb-section">Tableaux</div>
    <div class="sb-boards" id="sbBoards"></div>
    <button type="button" class="sb-add" id="sbAddBoard"></button>
    <div class="sb-habits" id="sbHabits"></div>
    <div class="sb-foot">
      <button type="button" class="sb-foot-btn" id="themeBtn"></button>
      <button type="button" class="sb-foot-btn" id="logoutBtn"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10"/><path d="M15 8l4 4-4 4M19 12H9"/></svg></span>Se déconnecter</button>
      <p class="sync-status" id="syncStatus" role="status"></p>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="stage">
    <header class="mobilebar">
      <button type="button" class="icon-plain" id="menuBtn" aria-label="Menu">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>
      </button>
      <h1 id="mobileTitle">Horizons</h1>
    </header>

    <main class="planner" id="planner"></main>

    <!-- ============== HABITUDES ============== -->
    <section id="habitsModule" class="habits-wrap" hidden>
      <header class="topbar">
        <span class="icon-spacer" aria-hidden="true"></span>
        <button id="weekLabel" class="week-label">Cette semaine ▾</button>
        <button id="addHabitBtn" class="icon-btn add-btn" title="Ajouter une habitude" aria-label="Ajouter une habitude">+</button>
      </header>

      <div class="view-toggle">
        <button class="view-tab active" data-view="week">Semaine</button>
        <button class="view-tab" data-view="trends">Tendances</button>
      </div>

      <nav id="weekNav" class="week-nav">
        <button id="prevWeek" class="nav-arrow" aria-label="Semaine précédente">‹</button>
        <div id="daysRow" class="days-row"></div>
        <button id="nextWeek" class="nav-arrow" aria-label="Semaine suivante">›</button>
      </nav>

      <div id="habitList" class="habit-list"></div>

      <div id="dayRecapRow" class="day-recap-row" hidden></div>

      <div id="weekRecap" class="daily-recap" hidden>
        <span class="recap-label">Récap de la semaine</span>
        <span id="weekRecapValue" class="recap-value">-</span>
      </div>

      <div id="trendsView" class="trends-view" hidden></div>

      <p id="habitEmptyState" class="empty-state" hidden>
        Aucune habitude pour l'instant.<br>Appuie sur <strong>+</strong> pour en créer une.
      </p>
    </section>

    <aside class="detail" id="detail" hidden aria-label="Détail de la tâche"></aside>
  </div>
</div>

<!-- Habit add/edit modal -->
<div id="habitModalOverlay" class="modal-overlay" hidden>
  <div class="modal">
    <h2 id="habitModalTitle">Nouvelle habitude</h2>

    <label class="field">
      <span>Nom</span>
      <input type="text" id="habitName" placeholder="Ex. Faire du sport" maxlength="60">
    </label>

    <fieldset class="field radio-field">
      <legend>Cette habitude est-elle bonne pour moi ?</legend>
      <label class="radio-option">
        <input type="radio" name="isGood" value="good" checked>
        <span>Oui, je veux la renforcer</span>
      </label>
      <label class="radio-option">
        <input type="radio" name="isGood" value="bad">
        <span>Non, je veux la réduire / arrêter</span>
      </label>
    </fieldset>

    <div class="field">
      <span>Importance</span>
      <div class="weight-row">
        <input type="range" id="habitWeight" min="1" max="10" value="5" step="1">
        <span class="weight-value" id="habitWeightValue">5</span>
      </div>
    </div>

    <label class="field">
      <span>Catégorie</span>
      <select id="habitCategory">
        <option value="Productivité">Productivité</option>
        <option value="Santé">Santé</option>
        <option value="Famille">Famille</option>
        <option value="Personnel">Personnel</option>
        <option value="Travail">Travail</option>
        <option value="Loisirs">Loisirs</option>
        <option value="Autre">Autre</option>
      </select>
    </label>

    <label class="field">
      <span>Description <small>(optionnel)</small></span>
      <textarea id="habitDescription" rows="3" placeholder="Pourquoi cette habitude compte pour toi..." maxlength="280"></textarea>
    </label>

    <div class="modal-actions">
      <button id="habitDeleteBtn" class="btn btn-danger" hidden>Supprimer</button>
      <div class="modal-actions-right">
        <button id="habitCancelBtn" class="btn btn-ghost">Annuler</button>
        <button id="habitSaveBtn" class="btn btn-primary">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<!-- Week picker -->
<div id="weekPickerOverlay" class="modal-overlay" hidden>
  <div class="modal week-picker-modal">
    <div class="week-picker-header">
      <button type="button" id="weekPickerPrevMonth" class="nav-arrow" aria-label="Mois précédent">‹</button>
      <span id="weekPickerMonthLabel">Août 2026</span>
      <button type="button" id="weekPickerNextMonth" class="nav-arrow" aria-label="Mois suivant">›</button>
    </div>
    <div class="week-picker-grid" id="weekPickerGrid"></div>
    <div class="modal-actions">
      <button type="button" id="weekPickerTodayBtn" class="btn btn-ghost">Aujourd'hui</button>
      <div class="modal-actions-right">
        <button type="button" id="weekPickerCloseBtn" class="btn btn-ghost">Fermer</button>
      </div>
    </div>
  </div>
</div>

<!-- Habit day-cell popup -->
<div id="cellPopup" class="cell-popup" hidden>
  <div class="popup-arrow"></div>
  <div class="popup-actions">
    <button class="popup-action" data-action="erase">
      <span class="popup-icon">⌫</span><span class="popup-label">Erase</span>
    </button>
    <button class="popup-action popup-yes" data-action="done">
      <span class="popup-icon">✓</span><span class="popup-label">Yes</span>
    </button>
    <button class="popup-action popup-no" data-action="missed">
      <span class="popup-icon">✕</span><span class="popup-label">No</span>
    </button>
    <button class="popup-action" data-action="skipped">
      <span class="popup-icon">⏭</span><span class="popup-label">Skip</span>
    </button>
  </div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
